<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connected Counterparties Management – Phase I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --frame:#DCE1EC;
  --frame-ink:#0F1A3C;
  /* slide canvas tokens (the slide itself stays a light presentation surface) */
  --navy:#0F1A3C; --ink:#1A1A2E; --muted:#5B6475; --line:#DDE2EE;
  --blue:#293AE0; --purple:#5746C6; --lilac:#9286EA; --sky:#2B7FD4;
  --tint:#EEF1F6; --lav:#E5E7FB; --paper:#FBFCFE;
  --teal:#0B7F6D; --teal-bg:#E2F4EF; --teal-line:#9BD8CB;
  --amber:#9A5B00; --amber-fill:#F2A21B; --amber-bg:#FFF3DC; --amber-line:#F3CD85;
  --stop:#B03A26; --stop-bg:#FBE8E4;
  --font:"Plus Jakarta Sans","Neue Plak","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --frame:#0A1024; --frame-ink:#E6E9F5; color-scheme:dark; }
}
:root[data-theme="dark"]{ --frame:#0A1024; --frame-ink:#E6E9F5; color-scheme:dark; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--frame);color:var(--frame-ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;background:var(--paper);color:var(--ink);overflow:hidden;border-radius:6px;box-shadow:0 10px 40px rgba(15,26,60,.18)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.noscript{padding:40px;font-size:20px}

/* slide frame */
.slide{position:absolute;left:0;right:0;top:0;bottom:60px;padding:50px 72px 26px;display:flex;flex-direction:column}
.slide.enter-f{animation:inF .45s cubic-bezier(.2,.7,.2,1)}
.slide.enter-b{animation:inB .45s cubic-bezier(.2,.7,.2,1)}
@keyframes inF{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.logo{position:absolute;top:40px;right:64px;width:138px;height:auto}
.kick{font-size:16px;font-weight:600;color:var(--blue);margin:0 0 10px;display:flex;align-items:center;gap:12px}
.kick .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--lav);color:var(--blue);font-size:14px;font-weight:700}
h1,h2,h3,p{margin:0}
.title{font-size:44px;line-height:1.1;font-weight:800;color:var(--navy);letter-spacing:-.015em;max-width:1180px}
.sub{font-size:20px;color:var(--muted);margin-top:10px;max-width:1100px;line-height:1.4}
.illus{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);background:var(--tint);border:1px dashed #B9C2D6;border-radius:999px;padding:4px 12px;white-space:nowrap}
.body{flex:1;min-height:0;margin-top:24px;display:flex;gap:28px}
.col{display:flex;flex-direction:column;min-height:0}

/* primitives */
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.panel.soft{background:var(--tint);border-color:transparent}
.ptitle{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-size:17px;font-weight:700;background:var(--blue);color:#fff;transition:transform .15s,background .2s,opacity .2s;line-height:1.1}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid #C9D0E0}
.btn.credit{background:var(--navy)}
.btn.ok{background:var(--teal)}
.btn.warn{background:#fff;color:var(--stop);border:1.5px solid #E5B1A7}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px dashed #C3CAD9;font-weight:600}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:10px}
.btn .k{font-size:12px;font-weight:700;opacity:.75;border:1px solid currentColor;border-radius:5px;padding:1px 5px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;white-space:nowrap;line-height:1.2}
.pill.ok{background:var(--teal-bg);color:var(--teal)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.info{background:var(--lav);color:var(--blue)}
.pill.mute{background:var(--tint);color:var(--muted)}
.pill.stop{background:var(--stop-bg);color:var(--stop)}
.pill.navy{background:var(--navy);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.actor{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:7px;padding:3px 9px;white-space:nowrap}
.actor.sys{color:var(--blue);background:#fff;border:1.5px solid #AEB6F3}
.actor.cr{color:#fff;background:var(--navy);border:1.5px solid var(--navy)}
.co{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;flex:none}
.co.A{background:var(--blue)}.co.B{background:var(--purple)}.co.C{background:var(--sky)}.co.D{background:#fff;color:var(--muted);border:2px dashed #9AA3B5}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:15px}
.fade-in{animation:fi .45s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.hint{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hint b{color:var(--blue)}
textarea{width:100%;font-family:inherit;font-size:16px;border:1.5px solid #C9D0E0;border-radius:10px;padding:10px 12px;resize:none;color:var(--ink);background:#fff}
.req{color:var(--stop);font-weight:700}
.note{font-size:14px;color:var(--muted);line-height:1.45}
table.t{border-collapse:collapse;width:100%;font-size:17px}
table.t th{font-size:13px;color:var(--muted);font-weight:700;text-align:right;padding:8px 10px;border-bottom:1.5px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:14px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:800;color:var(--navy);border-bottom:0;background:var(--tint)}
.riyal{height:.78em;width:auto;vertical-align:-.04em;margin-right:3px}

/* svg network */
svg text{font-family:var(--font)}
.edge-draw{transition:stroke-dashoffset 1.1s cubic-bezier(.6,.1,.3,1),opacity .4s}
.fadeT{transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.nodeMove{transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .6s}
.float1{animation:float1 7s ease-in-out infinite}
.float1.fB{animation-delay:-2.3s;animation-duration:8s}
.float1.fC{animation-delay:-4.6s;animation-duration:7.5s}
@keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hull{transition:opacity .55s ease,transform .6s cubic-bezier(.2,1.2,.4,1);transform-box:fill-box;transform-origin:center}
.chipHit{cursor:pointer}
.chipHit:focus-visible{outline:none}
.chipHit:focus-visible rect.chipbg{stroke:var(--blue);stroke-width:3}

/* footer */
.foot{position:absolute;left:0;right:0;bottom:0;height:60px;display:flex;align-items:center;gap:18px;padding:0 24px 0 72px;border-top:1px solid var(--line);background:#fff;z-index:5}
.foot .reg{font-family:"IBM Plex Sans Arabic",var(--font);font-size:13px;color:var(--muted);direction:rtl;white-space:nowrap}
.foot .proj{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.dots{display:flex;gap:6px;margin-left:auto}
.dots button{width:30px;height:8px;border-radius:5px;border:0;background:#D6DBE7;padding:0;transition:background .3s,width .3s}
.dots button.on{background:var(--blue);width:46px}
.dots button.done{background:#A9B2F0}
.fbtn{white-space:nowrap;border:1px solid #CFD5E3;background:#fff;color:var(--navy);border-radius:9px;height:38px;min-width:38px;padding:0 12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.fbtn:disabled{opacity:.35;cursor:default}
.fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.count{font-size:15px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.prog{position:absolute;left:0;top:0;height:3px;background:var(--blue);transition:width .45s ease}

/* notes drawer */
.notes{position:absolute;right:0;top:0;bottom:60px;width:460px;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(15,26,60,.12);z-index:8;padding:28px 30px;overflow:auto;animation:slideL .3s ease}
@keyframes slideL{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.notes h4{margin:0 0 6px;font-size:14px;color:var(--blue)}
.notes p,.notes li{font-size:16px;line-height:1.5;color:var(--ink)}
.notes ul{margin:0 0 16px;padding-left:20px}
.notes .blk{margin-bottom:16px}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;font-size:16px;font-weight:600;z-index:9;animation:fi .3s ease;max-width:900px;text-align:center}
.help{position:absolute;inset:0 0 60px 0;background:rgba(15,26,60,.55);z-index:10;display:flex;align-items:center;justify-content:center}
.help .card{background:#fff;border-radius:20px;padding:34px 40px;width:640px}
.help table{font-size:17px;border-collapse:collapse;width:100%}
.help td{padding:8px 4px;border-bottom:1px solid var(--line)}
.kbd{display:inline-block;border:1px solid #C9D0E0;border-bottom-width:3px;border-radius:7px;padding:2px 9px;font-weight:700;font-size:14px;min-width:28px;text-align:center;background:var(--tint)}

/* slide specific */
.bigq{font-size:74px;font-weight:800;color:var(--navy);line-height:1.02;letter-spacing:-.025em}
.stepper{display:flex;gap:8px;align-items:center}
.stepper .s{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.stepper .s i{font-style:normal;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--tint);color:var(--muted);font-size:13px}
.stepper .s.on{color:var(--navy)}
.stepper .s.on i{background:var(--blue);color:#fff}
.stepper .s.done i{background:var(--teal);color:#fff}
.stepper .bar{width:28px;height:2px;background:var(--line)}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stage4{border-radius:16px;padding:16px 18px;border:1.5px solid var(--line);background:#fff;transition:all .45s ease;min-height:186px;position:relative}
.stage4.on{border-color:var(--blue);box-shadow:0 8px 24px rgba(41,58,224,.13)}
.stage4.off{opacity:.45}
.stage4 h3{font-size:18px;color:var(--navy);margin:6px 0 8px;line-height:1.2}
.stage4 .n{font-size:13px;font-weight:800;color:var(--blue)}
.stage4 .arrow{position:absolute;right:-14px;top:50%;width:12px;height:12px;border-top:2.5px solid #AEB6F3;border-right:2.5px solid #AEB6F3;transform:translateY(-50%) rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1.5px solid #CBD2E2;background:#fff;color:var(--navy);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.tchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tchip .src{font-size:11px;font-weight:800;border-radius:4px;padding:1px 5px}
.tchip .src.a{background:var(--lav);color:var(--blue)}
.tchip .src.m{background:var(--amber-bg);color:var(--amber)}
.tchip.on .src.a{background:#3442c9;color:#fff}
.tchip.on .src.m{background:#B98018;color:#fff}
.kv{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;font-size:16px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;color:var(--ink);font-weight:500}
.rule{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.35;padding:9px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .m{flex:none;width:22px;height:22px;border-radius:6px;background:var(--lav);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin-top:1px}
.lc{display:flex;align-items:center;gap:10px}
.lcn{border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--muted);transition:all .4s;text-align:center;line-height:1.2}
.lcn.on{border-color:var(--navy);color:var(--navy);box-shadow:0 6px 18px rgba(15,26,60,.12);transform:translateY(-2px)}
.lcn.ok.on{border-color:var(--teal);color:var(--teal);background:var(--teal-bg)}
.lcn.warn.on{border-color:var(--amber-fill);color:var(--amber);background:var(--amber-bg)}
.lcn.stop.on{border-color:#E5B1A7;color:var(--stop);background:var(--stop-bg)}
.lcn.mute.on{border-color:#9AA3B5;color:#3d4556;background:var(--tint)}
.lca{color:#9AA3B5;font-size:20px;font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;display:flex;align-items:center;gap:8px}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.tabs button i{font-style:normal;font-size:12px;width:20px;height:20px;border-radius:50%;background:var(--tint);display:inline-flex;align-items:center;justify-content:center}
.tabs button.on i{background:var(--blue);color:#fff}
.bar-stack{display:flex;height:34px;border-radius:7px;overflow:hidden;background:var(--tint)}
.bar-stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hist{border-left:2px solid var(--line);margin-left:8px;padding-left:20px}
.hist .ev{position:relative;padding:0 0 16px}
.hist .ev:before{content:"";position:absolute;left:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 2px var(--blue)}
.hist .ev.w:before{background:var(--amber-fill);box-shadow:0 0 0 2px var(--amber-fill)}
.hist .ev.k:before{background:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.hist .ev.d:before{background:#9AA3B5;box-shadow:0 0 0 2px #9AA3B5}
.hist .ev b{font-size:16px;color:var(--navy)}
.hist .ev div{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.4}
.acc{border:1.5px solid var(--line);border-radius:14px;background:#fff;transition:border-color .2s,box-shadow .2s}
.acc+.acc{margin-top:8px}
.acc.on{border-color:var(--blue);box-shadow:0 6px 20px rgba(41,58,224,.1)}
.acc>button{width:100%;text-align:left;border:0;background:transparent;padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;color:var(--navy)}
.acc>button .tg{margin-left:auto;font-size:20px;color:var(--blue);transition:transform .25s;line-height:1}
.acc.on>button .tg{transform:rotate(45deg)}
.acc ol{margin:0;padding:0 18px 14px 44px;font-size:15.5px;line-height:1.45;color:var(--ink)}
.acc ol li{margin-bottom:5px}
.inc{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:12px 0}
.inc .ix{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.inc h3{font-size:18px;color:var(--navy);line-height:1.2}
.uc{display:inline-block;font-size:13px;font-weight:700;color:var(--blue);background:var(--lav);border-radius:6px;padding:2px 7px;margin:5px 5px 0 0}
.closing{background:var(--navy);color:#fff;border-radius:18px;padding:18px 26px;font-size:20px;line-height:1.4;font-weight:600}
.closing b{color:#C9CEFF}
.slider{width:100%;accent-color:var(--blue)}
.ownrow{display:grid;grid-template-columns:150px 1fr 62px;gap:12px;align-items:center;font-size:15px;font-weight:600}
.ownrow output{font-weight:800;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;border:0;background:transparent;padding:0;text-align:left}
.switch .tr{width:42px;height:24px;border-radius:12px;background:#C9D0E0;position:relative;transition:background .2s;flex:none}
.switch .tr:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on .tr{background:var(--blue)}
.switch.on .tr:after{transform:translateX(18px)}
.statusbox{border-radius:16px;padding:14px 16px;border:1.5px solid var(--line);transition:all .45s}
.statusbox .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.statusbox .val{font-size:22px;font-weight:800;margin-top:4px;display:flex;align-items:center;gap:8px}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(242,162,27,.6)}100%{box-shadow:0 0 0 18px rgba(242,162,27,0)}}
.strike{text-decoration:line-through;color:var(--muted)}

/* v2 additions */
.layer{display:flex;align-items:center;gap:12px;border:1.5px solid #DDE2EE;background:#fff;border-radius:12px;padding:8px 12px;transition:all .35s}
.layer .lic{flex:none;width:30px;display:flex;justify-content:center}
.layer .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.layer .val{font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.25}
.layer .lsub{font-size:13px;color:var(--muted);margin-top:2px}
.layer.warnL{border-color:var(--amber-line);background:var(--amber-bg)}
.layer.grpL{border-style:dashed;border-color:#AEB6F3;background:#F7F8FE}
.lconn{font-size:12.5px;font-weight:600;color:#7C86A6;padding:3px 0 3px 22px}
.legend5{position:absolute;left:16px;top:12px;display:flex;gap:16px;font-size:13px;font-weight:600;color:var(--muted);z-index:1}
.legend5 span{display:inline-flex;align-items:center;gap:6px}
.trp{outline:none}
.trp.live{cursor:pointer}
.trp.live:hover rect,.trp.live:focus-visible rect{stroke:#293AE0;stroke-width:3}
.trp.live rect{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 5px rgba(41,58,224,.45))}}
.flow{stroke-dasharray:8 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.evbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid #CBD2E2;background:#fff;border-radius:12px;padding:8px 12px;font-family:inherit;transition:all .2s}
.evbtn:hover:not(:disabled){border-color:var(--blue);transform:translateY(-1px)}
.evbtn:disabled{cursor:default}
.evbtn.done{background:var(--tint);border-color:transparent}
.evbtn .et{display:block;font-size:15px;font-weight:800;color:var(--navy)}
.evbtn .ed{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.evbtn .go{font-size:13px;font-weight:800;color:#fff;background:var(--blue);border-radius:8px;padding:5px 10px;white-space:nowrap}
.evbtn:disabled:not(.done) .go{background:#C9D0E0}
.keepline{font-size:14.5px;font-weight:700;color:var(--navy);background:var(--tint);border-radius:10px;padding:8px 12px;transition:all .35s}
.keepline.hot{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1.5px var(--amber-line)}
.depgrid{display:grid;grid-template-columns:1fr 78px 78px;column-gap:8px;row-gap:8px;align-items:stretch}
.railh{font-size:12.5px;font-weight:800;color:var(--muted);text-align:center;line-height:1.2;align-self:end}
.inccard{display:flex;gap:12px;align-items:flex-start;border:1.5px dashed #B9C2D6;background:#fff;border-radius:14px;padding:10px 12px;font-family:inherit;transition:all .3s;cursor:pointer}
.inccard .ix{flex:none;width:38px;height:38px;border-radius:11px;background:var(--navy);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.inccard .itl{font-size:16.5px;font-weight:800;color:var(--navy)}
.inccard .iwhy{display:block;font-size:13.5px;color:var(--ink);margin-top:6px;line-height:1.4}
.inccard.found{border-style:solid;border-color:#AEB6F3;background:#F4F5FE}
.inccard.found .ix{background:var(--blue)}
.inccard.sel{border-color:var(--blue);border-style:solid;box-shadow:0 8px 22px rgba(41,58,224,.14)}
.inccard.pre{border-color:var(--teal);border-style:solid;background:var(--teal-bg)}
.inccard.dim{opacity:.5}
.rail{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:800;line-height:1.2;padding:4px;margin:-4px 0}
.rail.first{border-radius:12px 12px 0 0;margin-top:0}
.rail.last{border-radius:0 0 12px 12px;margin-bottom:0}
.rail.dm.f{background:var(--navy);color:#fff}
.rail.dm.l{background:var(--lav);color:var(--blue)}
.rail.au.f{background:var(--amber-fill);color:#3b2400}
.rail.au.l{background:var(--amber-bg);color:var(--amber)}

/* slide 8 roadmap */
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:end;height:274px}
.roadcol{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.inc8{border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;background:#fff;border:1.5px solid #DDE2EE;opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.9,.25,1),box-shadow .5s;position:relative;overflow:hidden}
.inc8:before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--c)}
.inc8.on{opacity:1;transform:none;box-shadow:0 14px 34px rgba(15,26,60,.10)}
.inc8.first{background:var(--c);border-color:var(--c);color:#fff}
.inc8.first:before{display:none}
.n8{font-size:44px;font-weight:800;line-height:1;color:var(--c);letter-spacing:-.02em}
.inc8.first .n8{color:#fff}
.uc8{font-size:13px;font-weight:800;color:var(--c);background:#fff;border:1.5px solid var(--c);border-radius:8px;padding:3px 8px;white-space:nowrap}
.t8{font-size:21px;font-weight:800;color:var(--navy);line-height:1.2}
.inc8.first .t8{color:#fff}
.s8{font-size:15px;line-height:1.4;color:var(--muted);margin-top:6px}
.inc8.first .s8{color:#D9DCFF}
.roadlink{position:absolute;left:-22px;width:22px;bottom:60px;height:2px;display:flex;justify-content:center;align-items:center;z-index:2}
.roadlink:before{content:"";position:absolute;inset:0;background:#AEB6F3;transform:scaleX(0);transform-origin:left;transition:transform .5s ease .25s}
.roadlink.on:before{transform:scaleX(1)}
.roadlink span{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #AEB6F3;color:var(--blue);font-size:17px;font-weight:800;line-height:19px;text-align:center;opacity:0;transform:scale(.6);transition:opacity .4s ease .5s,transform .4s ease .5s}
.roadlink.on span{opacity:1;transform:none}
.fnd{display:grid;grid-template-columns:repeat(4,1fr);column-gap:22px;row-gap:0;background:var(--tint);border-radius:18px;padding:10px 20px 10px;position:relative;opacity:.55;transition:opacity .5s}
.fnd.on{opacity:1}
.fndh{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.fndh b{font-size:16px;color:var(--navy)}
.fndh span{font-size:14px;color:var(--muted)}
.fndrow{display:contents}
.fndt{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--navy);margin-top:2px;margin-bottom:-4px}
.fndc{position:relative;height:26px;display:flex;align-items:center}
.fndc .trk{position:absolute;left:-11px;right:-11px;top:50%;height:4px;margin-top:-2px;background:#D6DBE7;border-radius:2px;transform-origin:left;transition:background .5s}
.fndc.on .trk{background:#AEB6F3}
.fndc:first-child .trk{left:0}
.fndc .mk{position:relative;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #C9D0E0;margin-left:2px;flex:none;transition:all .4s;z-index:1}
.fndc.d.on .mk{background:var(--navy);border-color:var(--navy)}
.fndc.i .mk{border-radius:4px;transform:rotate(45deg)}
.fndc.i.on .mk{background:var(--amber-fill);border-color:var(--amber-fill)}
.fndc .ml{position:relative;z-index:1;margin-left:10px;font-size:13.5px;font-weight:700;color:var(--muted);background:var(--tint);padding:0 6px;opacity:0;transition:opacity .4s}
.fndc.on .ml{opacity:1;color:var(--navy)}
.closing8{background:var(--navy);color:#fff;border-radius:18px;padding:16px 26px;font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.3;opacity:0;transform:translateY(12px);transition:opacity .7s ease .3s,transform .7s ease .3s}
.closing8.on{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

var e=React.createElement, useState=React.useState, useEffect=React.useEffect, useRef=React.useRef, useCallback=React.useCallback;

/* ---------- scenario constants (illustrative) ---------- */
var COL={A:"#293AE0",B:"#5746C6",C:"#2B7FD4"};
var POS={A:[130,330],B:[300,108],C:[470,330]};
var THRESH=50;

/* ---------- small components ---------- */
function Gear(){return html`<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 0 0 1.7 1L11 21h4l.4-2.9a7.7 7.7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg>`;}
function Person(){return html`<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="currentColor"/><path fill="currentColor" d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>`;}
function Actor(p){return p.k==="cr"?html`<span className="actor cr"><${Person}/>Credit decision</span>`:html`<span className="actor sys"><${Gear}/>System</span>`;}
function Co(p){return html`<span className=${"co "+p.id} aria-hidden="true">${p.id}</span>`;}
function Cname(p){return html`<span className="row" style=${{gap:8,display:'inline-flex'}}><${Co} id=${p.id}/><span style=${{fontWeight:700}}>Company ${p.id}</span></span>`;}
function R(p){return html`<span style=${{whiteSpace:'nowrap'}}><img className="riyal" src=${RIYAL} alt="SAR"/>${p.v}</span>`;}
function Illus(p){return html`<span className="illus" title="All companies, people and values are fictional"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 7v6M12 16.5v.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>${p.t||"Illustrative scenario, fictional data"}</span>`;}
function Header(p){
  return html`<div>
    <div className="kick"><span className="num">${p.n}</span>${p.kick}${p.illus?html`<span style=${{marginLeft:6}}><${Illus}/></span>`:null}</div>
    <h2 className="title">${p.title}</h2>
    ${p.sub?html`<p className="sub">${p.sub}</p>`:null}
  </div>`;
}
function Switch(p){return html`<button className=${"switch"+(p.on?" on":"")} role="switch" aria-checked=${p.on?"true":"false"} onClick=${p.onClick}><span className="tr"></span><span>${p.children}</span></button>`;}

/* ---------- network graph ---------- */
function capsule(a,b,pad){
  var x1=POS[a][0],y1=POS[a][1],x2=POS[b][0],y2=POS[b][1];
  var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx)*180/Math.PI;
  var w=len+pad*2,h=pad*2;
  return {cx:(x1+x2)/2,cy:(y1+y2)/2,w:w,h:h,ang:ang};
}
var EDGE={
  AB:{a:"A",b:"B",type:"Shared Ownership",party:"Saad, Khalid",mx:192,my:250},
  BC:{a:"B",b:"C",type:"Shared Ind. Guarantee",party:"Layla",mx:408,my:250}
};
function Edge(p){
  var d=EDGE[p.id],A=POS[d.a],B=POS[d.b];
  var path="M"+A[0]+" "+A[1]+" L"+B[0]+" "+B[1];
  var sel=p.sel, mark=p.mark;
  var stroke = mark==="pass"?"#0B7F6D":mark==="fail"?"#C98A12":(sel?"#293AE0":"#7C86A6");
  var chipW=184,chipH=50;
  var onKey=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();p.onSel&&p.onSel(p.id);}};
  return html`<g>
    <path d=${path} pathLength="1" fill="none" stroke=${stroke} strokeWidth=${sel?5:3.5} strokeLinecap="round"
      className="edge-draw" style=${{strokeDasharray:1,strokeDashoffset:p.show?0:1,opacity:p.show?1:0}}/>
    ${p.chips?html`<g className=${p.onSel?"chipHit fadeT":"fadeT"} tabIndex=${p.onSel?0:-1} role=${p.onSel?"button":null}
        aria-label=${p.onSel?("Inspect "+d.type+" relationship between Company "+d.a+" and Company "+d.b):null}
        onClick=${p.onSel?function(){p.onSel(p.id);}:null} onKeyDown=${p.onSel?onKey:null}
        style=${{opacity:p.show?1:0,transitionDelay:p.show?"0.7s":"0s"}}>
      <rect className="chipbg" x=${d.mx-chipW/2} y=${d.my-chipH/2} width=${chipW} height=${chipH} rx="12" fill="#fff" stroke=${sel?"#293AE0":"#CBD2E2"} strokeWidth=${sel?2.5:1.5}/>
      <text x=${d.mx} y=${d.my-4} textAnchor="middle" fontSize="15" fontWeight="700" fill="#0F1A3C">${d.type}</text>
      <text x=${d.mx} y=${d.my+15} textAnchor="middle" fontSize="13.5" fontWeight="500" fill="#5B6475">via ${d.party}</text>
      ${mark?html`<g key=${mark} transform=${"translate("+(d.mx+chipW/2-4)+","+(d.my-chipH/2+2)+")"}><g className="pop" style=${{transformBox:"fill-box",transformOrigin:"center"}}>
        <circle r="15" fill=${mark==="pass"?"#0B7F6D":"#F2A21B"}/>
        ${mark==="pass"?html`<path d="M-6 0 L-2 5 L7 -5" stroke="#fff" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"/>`:html`<path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#fff" strokeWidth="3" strokeLinecap="round"/>`}
      </g></g>`:null}
    </g>`:null}
  </g>`;
}
function Node(p){
  var x=POS[p.id][0],y=POS[p.id][1],r=46;
  var off=p.off||[0,0];
  return html`<g className="nodeMove" style=${{transform:"translate("+off[0]+"px,"+off[1]+"px)",opacity:p.hide?0:1}}>
    ${p.halo?html`<circle cx=${x} cy=${y} r=${r+12} fill="none" stroke=${COL[p.id]} strokeOpacity=".25" strokeWidth="8"/>`:null}
    <circle cx=${x} cy=${y} r=${r} fill=${COL[p.id]}/>
    <text x=${x} y=${y+11} textAnchor="middle" fontSize="32" fontWeight="800" fill="#fff">${p.id}</text>
    ${p.label!==false?(p.id==="B"?html`<text x=${x} y=${y-r-34} textAnchor="middle" fontSize="17" fontWeight="700" fill="#0F1A3C">Company ${p.id}</text>
    <text x=${x} y=${y-r-14} textAnchor="middle" fontSize="13.5" fontWeight="500" fill="#5B6475">${p.sub||"Registered in Manafa"}</text>`:html`<text x=${x} y=${y+r+26} textAnchor="middle" fontSize="17" fontWeight="700" fill="#0F1A3C">Company ${p.id}</text>
    <text x=${x} y=${y+r+46} textAnchor="middle" fontSize="13.5" fontWeight="500" fill="#5B6475">${p.sub||"Registered in Manafa"}</text>`):null}
  </g>`;
}
function Hull(p){
  var c=capsule(p.a,p.b,70);
  return html`<g className="hull" style=${{opacity:p.show?1:0,transform:p.show?"scale(1)":"scale(.9)"}}>
    <rect x=${c.cx-c.w/2} y=${c.cy-c.h/2} width=${c.w} height=${c.h} rx=${c.h/2}
      transform=${"rotate("+c.ang+" "+c.cx+" "+c.cy+")"} fill=${p.fill} fillOpacity=".10" stroke=${p.fill} strokeWidth="2.5" strokeDasharray=${p.dash?"8 7":null}/>
  </g>`;
}
function Net(p){
  /* p: edges, chips, sel, onSel, marks, hulls{g1,g2}, all, acDash, offs, hideNodes, h */

var TR={

function availT(st){
  if(st.phase==="pending") return ["approve","reject"];
  if(st.phase==="approved") return st.flag?["keep","rmodify","rdissolve"]:["modify","flag","ddissolve"];
  return [];
}
function StateDiagram(p){
  var st=p.st,av=availT(st),last=st.last;
  var ph=st.phase,flag=st.flag;
  function node(id,x,y,w,h,title,sub,on,tone){
    var c={ok:["#0B7F6D","#E2F4EF"],warn:["#C98A12","#FFF3DC"],stop:["#B03A26","#FBE8E4"],mute:["#5B6475","#EEF1F6"]}[tone];
    return html`<g key=${id} className="fadeT">
      <rect x=${x} y=${y} width=${w} height=${h} rx="14" fill=${on?c[1]:"#fff"} stroke=${on?c[0]:"#CBD2E2"} strokeWidth=${on?3:1.6} style=${{transition:"all .4s"}}/>
      <text x=${x+w/2} y=${y+h/2+(sub?-2:6)} textAnchor="middle" fontSize="17" fontWeight="800" fill=${on?c[0]:"#3d4556"}>${title}</text>
      ${sub?html`<text x=${x+w/2} y=${y+h/2+17} textAnchor="middle" fontSize="13" fontWeight="600" fill="#5B6475">${sub}</text>`:null}
    </g>`;
  }
  function edge(id,d,dash){
    var hot=last===id||(id==="flag"&&flag);
    var live=av.indexOf(id)>=0;
    var col=hot?(id==="flag"?"#F2A21B":"#293AE0"):live?"#7C86A6":"#D3D9E6";
    return html`<path key=${"e"+id} d=${d} fill="none" stroke=${col} strokeWidth=${hot?3.5:2.2} strokeDasharray=${dash?"6 6":null} markerEnd=${"url(#ah"+(hot?(id==="flag"?"w":"b"):live?"g":"l")+")"} className=${hot?"flow":""} style=${{transition:"stroke .4s"}}/>`;
  }
  function pill(id){
    var t=TR[id],live=av.indexOf(id)>=0,hot=last===id;
    var h=t.s?38:28;
    var fill=live?(t.cr?"#0F1A3C":"#fff"):"#F4F6FA";
    var tc=live?(t.cr?"#fff":"#293AE0"):"#9AA3B5";
    var sc=live?(t.cr?"#0F1A3C":"#AEB6F3"):"#DDE2EE";
    var onKey=function(ev){if(live&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();p.act(id);}};
    return html`<g key=${"p"+id} className=${"trp"+(live?" live":"")} tabIndex=${live?0:-1} role="button" aria-disabled=${live?"false":"true"}
        aria-label=${t.l+(t.s?", "+t.s:"")+(live?"":" (not available now)")} onClick=${live?function(){p.act(id);}:null} onKeyDown=${onKey}>
      <rect x=${t.x-t.w/2} y=${t.y-h/2} width=${t.w} height=${h} rx=${h/2} fill=${fill} stroke=${hot?"#293AE0":sc} strokeWidth=${hot?2.5:1.5}/>
      ${!t.cr?html`<g transform=${"translate("+(t.x-t.w/2+16)+","+(t.y)+")"}><circle r="5" fill=${live?"#293AE0":"#C9D0E0"}/></g>`:null}
      <text x=${t.x+(t.cr?0:6)} y=${t.y+(t.s?-3:5)} textAnchor="middle" fontSize="14" fontWeight="800" fill=${tc}>${t.l}</text>
      ${t.s?html`<text x=${t.x} y=${t.y+12} textAnchor="middle" fontSize="11.5" fontWeight="600" fill=${live?"#C9CEFF":"#9AA3B5"}>${t.s}</text>`:null}
    </g>`;

  var mk=function(id,c){return html`<marker id=${"ah"+id} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill=${c}/></marker>`;};

    ${edge("approve","M165 103 L266 103")}
    ${edge("reject","M90 136 L90 246")}
    ${edge("modify","M330 58 C322 6, 398 6, 392 56")}
    ${edge("flag","M370 150 L370 216",true)}
    ${edge("keep","M270 252 C214 252, 214 140, 266 136")}
    ${edge("rmodify","M470 252 C526 252, 526 140, 474 136")}
    ${edge("rdissolve","M470 302 L551 302")}
    ${edge("ddissolve","M470 96 C612 96, 618 150, 617 264")}
    ${node("P",15,70,150,66,"Suggested","Pending Credit Review",ph==="pending","warn")}
    ${node("R",15,250,150,58,"Rejected",null,ph==="rejected","stop")}
    ${node("A",270,58,200,92,"Approved",st.members.length>2?"RG-1001, A + B + C":"RG-1001, A + B",ph==="approved","ok")}
    ${node("D",555,268,125,64,"Dissolved","history kept",ph==="dissolved","mute")}
    <g className="fadeT" style=${{opacity:flag?1:.55}}>
      <rect x="270" y="220" width="200" height="118" rx="14" fill=${flag?"#FFF3DC":"#fff"} stroke=${flag?"#F2A21B":"#D3D9E6"} strokeWidth=${flag?2.5:1.6} strokeDasharray="7 6"/>
      <text x="370" y="246" textAnchor="middle" fontSize="15" fontWeight="800" fill=${flag?"#9A5B00":"#7C86A6"}>⚑ Requires Reassessment</text>
      <text x="370" y="268" textAnchor="middle" fontSize="13" fontWeight="600" fill="#5B6475">A flag on the Approved</text>
      <text x="370" y="285" textAnchor="middle" fontSize="13" fontWeight="600" fill="#5B6475">group, not a status.</text>
      <text x="370" y="302" textAnchor="middle" fontSize="13" fontWeight="600" fill="#5B6475">Members unchanged.</text>
      <text x="370" y="326" textAnchor="middle" fontSize="12.5" fontWeight="700" fill=${flag?"#9A5B00":"#9AA3B5"}>Credit decides</text>
    </g>
    ${flag?html`<g key="fl" transform="translate(458,58)"><g className="pop" style=${{transformBox:"fill-box",transformOrigin:"center"}}><circle r="15" fill="#F2A21B"/><text y="6" textAnchor="middle" fontSize="16" fontWeight="800" fill="#fff">⚑</text></g></g>`:null}
    ${["approve","reject","modify","flag","keep","rmodify","rdissolve","ddissolve"].map(pill)}

}

   notes:{say:"This is the proposed delivery direction: four increments, each building on the one before. It is a direction, not sprint commitments or timelines.",
     demo:"Click Reveal increment for 01 through 04. As each appears, point at the foundation rows: the data model, event handling and audit capture are designed in 01, and the reassessment, notification and history interfaces land in 04.",
     emph:["Relationship Foundation comes first; the engine depends on it","Data model, event handling and audit capture designed early","Credit governance preserved in every increment"],
     next:"Close on the message: build the foundation first, deliver value incrementally, preserve Credit governance throughout."}}
];
function defaults(){return {
  0:{phase:0,run:0},1:{revealed:false},2:{sel:"AB",l2:0},3:{stage:0,type:"own"},
  4:{step:1,ownA:60,ownB:60,cm:false},
  5:{phase:"pending",mode:null,text:"",members:["A","B"],msg:null,crit:false,rel:null,flag:false,last:null,mod:false,reason:""},
  6:{tab:"overview",ev:{},decision:null,mode:null,text:""},
  7:{rev:0}
};}

/* ---------- presenter window ---------- */
function notesHTML(i){
  var s=SLIDES[i],n=s.notes,nx=SLIDES[i+1];
  return '<div class="top"><b>'+(i+1)+' / '+SLIDES.length+'</b> '+esc(s.title)+'<span class="nx">Next: '+(nx?esc(nx.title):'End')+'</span></div>'+
   '<h4>What to say</h4><p>'+esc(n.say)+'</p><h4>What to demonstrate</h4><p>'+esc(n.demo)+'</p><h4>Emphasize</h4><ul>'+n.emph.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul><h4>Transition</h4><p>'+esc(n.next)+'</p>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ---------- app ---------- */
function App(){
  var _i=useState(function(){var h=(location.hash||"").replace("#","");var m=/^s([1-8])$/.exec(h);return m?(+m[1]-1):0;}),idx=_i[0],setIdx=_i[1];
  var _d=useState("f"),dir=_d[0],setDir=_d[1];
  var _s=useState(defaults),S=_s[0],setS=_s[1];
  var _n=useState(false),notes=_n[0],setNotes=_n[1];
  var _h=useState(false),help=_h[0],setHelp=_h[1];
  var _t=useState(null),toast=_t[0],setToast=_t[1];
  var _sc=useState(1),scale=_sc[0],setScale=_sc[1];
  var pw=useRef(null),tRef=useRef(null);
  var N=SLIDES.length;

  useEffect(function(){
    function fit(){var w=window.innerWidth,h=window.innerHeight;setScale(Math.min(w/1600,h/900)*0.985);}
    fit();window.addEventListener("resize",fit);return function(){window.removeEventListener("resize",fit);};
  },[]);
  var showToast=useCallback(function(m){setToast(m);clearTimeout(tRef.current);tRef.current=setTimeout(function(){setToast(null);},2600);},[]);
  var go=useCallback(function(n){setIdx(function(cur){var t=Math.max(0,Math.min(N-1,n));setDir(t>=cur?"f":"b");return t;});},[N]);
  var next=useCallback(function(){setIdx(function(cur){setDir("f");return Math.min(N-1,cur+1);});},[N]);
  var prev=useCallback(function(){setIdx(function(cur){setDir("b");return Math.max(0,cur-1);});},[N]);
  function setSlide(i){return function(patch){setS(function(o){var c={};for(var k in o)c[k]=o[k];var m={};for(var k2 in o[i])m[k2]=o[i][k2];for(var k3 in patch)m[k3]=patch[k3];c[i]=m;return c;});};}
  function resetSlide(){var d=defaults();setS(function(o){var c={};for(var k in o)c[k]=o[k];c[idx]=d[idx];if(idx===0)c[0]={phase:0,run:(o[0].run||0)+1};return c;});showToast("Slide reset");}
  function resetAll(){setS(defaults());go(0);showToast("All scenarios reset");}
  function fullscreen(){try{if(document.fullscreenElement){document.exitFullscreen();}else{var p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){showToast("Full screen is blocked here. Use the viewer’s full-screen control.");});}}catch(err){showToast("Full screen is blocked here. Use the viewer’s full-screen control.");}}
  function openPresenter(){
    var w=null;try{w=window.open("","cc_presenter","width=620,height=780");}catch(err){w=null;}
    if(!w){showToast("Pop-ups are blocked here. Press N to show notes in the slide instead.");return;}
    w.document.open();
    w.document.write('<!DOCTYPE html><html><head><title>Presenter notes</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:"Plus Jakarta Sans",Segoe UI,Arial,sans-serif;margin:0;padding:24px 28px;background:#fff;color:#1A1A2E}h4{color:#293AE0;margin:18px 0 6px;font-size:14px}p,li{font-size:17px;line-height:1.5}.top{font-size:18px;color:#0F1A3C;border-bottom:1px solid #DDE2EE;padding-bottom:12px}.nx{display:block;color:#5B6475;font-size:14px;margin-top:4px}.ctl{display:flex;gap:8px;margin-bottom:12px}.ctl button{font:inherit;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid #CFD5E3;background:#fff;cursor:pointer}#tm{margin-left:auto;font-weight:700;color:#0F1A3C;align-self:center}</style></head><body><div class="ctl"><button id="pv">Previous</button><button id="nx">Next</button><span id="tm">00:00</span></div><div id="c"></div></body></html>');
    w.document.close();
    pw.current=w;
    w.document.getElementById("pv").onclick=function(){prev();};
    w.document.getElementById("nx").onclick=function(){next();};
    w.document.addEventListener("keydown",function(ev){if(ev.key==="ArrowRight"||ev.key==="PageDown")next();if(ev.key==="ArrowLeft"||ev.key==="PageUp")prev();});
    var t0=Date.now();var iv=setInterval(function(){if(w.closed){clearInterval(iv);return;}var s=Math.floor((Date.now()-t0)/1000);var el=w.document.getElementById("tm");if(el)el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");},1000);
    var c=w.document.getElementById("c");if(c)c.innerHTML=notesHTML(idx);
    showToast("Presenter notes opened in a separate window");
  }
  useEffect(function(){var w=pw.current;if(w&&!w.closed){var c=w.document.getElementById("c");if(c)c.innerHTML=notesHTML(idx);}},[idx]);

  useEffect(function(){
    function onKey(ev){
      var tg=ev.target&&ev.target.tagName;
      if(tg==="TEXTAREA"||tg==="INPUT"||tg==="SELECT"){ if(ev.key==="Escape"&&ev.target.blur)ev.target.blur(); return; }
      if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
      var k=ev.key;
      if(k==="ArrowRight"||k==="PageDown"){ev.preventDefault();next();}
      else if(k==="ArrowLeft"||k==="PageUp"){ev.preventDefault();prev();}
      else if(k==="Home"){ev.preventDefault();go(0);}
      else if(k==="End"){ev.preventDefault();go(N-1);}
      else if(k==="f"||k==="F"){fullscreen();}
      else if(k==="?"){setHelp(function(v){return !v;});}
      else if(k==="Escape"){setHelp(false);setNotes(false);}
    }
    window.addEventListener("keydown",onKey);return function(){window.removeEventListener("keydown",onKey);};
  });

  var sl=SLIDES[idx],C=sl.C,n=sl.notes;
  var W=1600*scale,H=900*scale;
  return html`<div className="stage" style=${{transform:"translate("+(-W/2)+"px,"+(-H/2)+"px) scale("+scale+")"}}>
    <div className="prog" style=${{width:((idx+1)/N*100)+"%"}}></div>
    <section key=${idx} className=${"slide enter-"+dir} aria-roledescription="slide" aria-label=${(idx+1)+" of "+N+": "+sl.title}>
      <img className="logo" src=${LOGO} alt="Manafa"/>
      ${sl.bare?null:html`<${Header} n=${idx+1} kick=${sl.k} title=${sl.title} sub=${sl.sub} illus=${sl.illus}/>`}
      <${C} st=${S[idx]} set=${setSlide(idx)} toast=${showToast}/>
    </section>
    ${notes?html`<aside className="notes" aria-label="Presenter notes">
      <div className="row" style=${{justifyContent:"space-between",marginBottom:14}}><b style=${{fontSize:15,color:"#0F1A3C"}}>Notes, slide ${idx+1}</b><button className="fbtn" onClick=${function(){setNotes(false);}}>Close</button></div>
      <div className="blk"><h4>What to say</h4><p>${n.say}</p></div>
      <div className="blk"><h4>What to demonstrate</h4><p>${n.demo}</p></div>
      <div className="blk"><h4>Emphasize</h4><ul>${n.emph.map(function(x){return html`<li key=${x}>${x}</li>`;})}</ul></div>
      <div className="blk"><h4>Transition</h4><p>${n.next}</p></div>
    </aside>`:null}
    ${help?html`<div className="help" onClick=${function(){setHelp(false);}}><div className="card" onClick=${function(ev){ev.stopPropagation();}}>
      <div style=${{fontSize:22,fontWeight:800,color:"#0F1A3C",marginBottom:12}}>Presenter controls</div>
      <table><tbody>
        <tr><td><span className="kbd">→</span> <span className="kbd">PgDn</span></td><td>Next slide</td></tr>
        <tr><td><span className="kbd">←</span> <span className="kbd">PgUp</span></td><td>Previous slide</td></tr>
        <tr><td><span className="kbd">Home</span> <span className="kbd">End</span></td><td>First or last slide</td></tr>
        <tr><td><span className="kbd">F</span></td><td>Full screen</td></tr>
        <tr><td><span className="kbd">?</span> <span className="kbd">Esc</span></td><td>Show or hide this help</td></tr>
      </tbody></table>
      <p className="note" style=${{marginTop:14}}>Interactive states are kept when you move between slides. Use Reset on a slide, or Reset all in the footer.</p>
      <div style=${{marginTop:16}}><button className="btn sm" onClick=${function(){setHelp(false);}}>Got it</button></div>
    </div></div>`:null}
    ${toast?html`<div className="toast" role="status">${toast}</div>`:null}
    <footer className="foot">
      <span className="reg">منافع شركة خاضعة لرقابة وإشراف البنك المركزي السعودي</span>
      <nav className="dots" aria-label="Slides">${SLIDES.map(function(s,i){return html`<button key=${i} className=${i===idx?"on":(i<idx?"done":"")} aria-label=${"Go to slide "+(i+1)+": "+s.title} aria-current=${i===idx?"true":null} onClick=${function(){go(i);}}></button>`;})}</nav>
      <button className="fbtn" onClick=${prev} disabled=${idx===0} aria-label="Previous slide">←</button>
      <span className="count">${idx+1} / ${N}</span>
      <button className="fbtn" onClick=${next} disabled=${idx===N-1} aria-label="Next slide">→</button>
      <button className="fbtn" onClick=${resetSlide} title="Reset this slide">Reset</button>
      <button className="fbtn" onClick=${resetAll} title="Reset all scenarios">Reset all</button>
      <button className="fbtn" onClick=${fullscreen} title="Full screen (F)" aria-label="Full screen">⛶</button>
      <button className="fbtn" onClick=${function(){setHelp(true);}} title="Keyboard help (?)" aria-label="Keyboard help">?</button>
    </footer>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
</body>
</html>
